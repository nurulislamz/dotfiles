# Keep worktrees in the location required by global agent rules.
worktree_dir: .worktrees
# One tmux session per worktree (not a window in the current session).
mode: session
# Preserve the existing whole-tab tmux theme without status icons.
status_format: false
nerdfont: true

dashboard:
  agent_columns: [number, session, project, worktree, git, pr, status, time, title]

# Init <worktree>/.workmux/task.md before the agent pane exists.
post_create:
  - tmux-tasklog init

# Compact task rows with a live status indicator and a coloured separator.
# One section per tmux session (= one worktree in session mode).
sidebar:
  layout: compact
  group_by: session
  templates:
    compact: "{status_icon} #[bold]{window_index}#[default] #[fg=cyan]│#[default] {pane_title}"
    tiles:
      - "{primary} {pane_suffix} {fill} {elapsed}"
      - "{secondary} {fill} {git_stats}"
      - "{pane_title} {fill} {pr_checks}"
    grouped:
      header: "{group} {fill} {group_count}"

[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=Cascadia Code:size=10, JetBrainsMono Nerd Font:size=10, Noto Color Emoji:size=10
initial-window-size-chars=180x45
initial-window-mode=windowed
pad=14x14
workers=0
selection-target=both

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Control+v Control+Shift+v Shift+Insert XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

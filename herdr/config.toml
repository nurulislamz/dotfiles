onboarding = false

[ui]
status_indicators = "symbols"
confirm_close = false

[ui.sound]
enabled = true

# Keys follow tmux/.tmux.conf.local. The prefix differs because herdr runs inside tmux, which keeps ctrl+b.
[keys]
prefix = "ctrl+a"
detach = "prefix+d"
settings = "prefix+shift+s"
workspace_picker = ["prefix+w", "prefix+s"]
rename_workspace = ["prefix+shift+w", "prefix+$"]
previous_workspace = "prefix+("
next_workspace = "prefix+)"
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+&"]
move_tab_previous = "prefix+{"
move_tab_next = "prefix+}"
split_vertical = ["prefix+v", "prefix+%", "prefix+_"]
split_horizontal = ["prefix+minus", 'prefix+"']
last_pane = "prefix+;"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
edit_scrollback = ["prefix+e", "prefix+["]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "ctrl+k"
navigate_pane_down = "ctrl+j"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.local/bin/herdr-nav left ctrl+h"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.local/bin/herdr-nav down ctrl+j"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.local/bin/herdr-nav up ctrl+k"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.local/bin/herdr-nav right ctrl+l"
